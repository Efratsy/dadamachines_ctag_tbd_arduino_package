name: Tag-Version Build & Release CTAG TBD Arduino Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v-Präfix (z.B. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      # 1) Tag-Commit für Build/ZIPs
      - name: Checkout tag commit
        uses: actions/checkout@v4

      - name: Derive VERSION
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
            V="${V#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "Version: $V"

      - name: Generate documentation with Doxygen
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          cd tools
          doxygen Doxyfile

      - name: Copy cores and libraries
        run: |
          rm -rf build esp32 rp2040
          mkdir -p build/esp32 build/rp2040
          # nur Inhalte kopieren, nicht den Ordner selbst
          cp -r hardware/esp32/*  build/esp32/
          cp -r hardware/rp2040/* build/rp2040/
          mkdir -p build/esp32/libraries build/rp2040/libraries
          cp -r libraries/* build/esp32/libraries/
          cp -r libraries/* build/rp2040/libraries/
      
      - name: Package cores (same layout as the old flow)
        run: |
          cd build
      
          mv esp32 esp32_tmp
          mkdir -p "esp32/${VERSION}"
          mv esp32_tmp/* "esp32/${VERSION}/"
      
          mv rp2040 rp2040_tmp
          mkdir -p "rp2040/${VERSION}"
          mv rp2040_tmp/* "rp2040/${VERSION}/"
      
          # Zips wie früher: Top-Level im Zip ist NUR die Versionsmappe
          cd esp32
          zip -r ../esp32-${VERSION}.zip .
          cd ..
      
          cd rp2040
          zip -r ../rp2040-${VERSION}.zip .
          cd ..
      
          # Zips ins Working-Dir des Jobs legen
          mv esp32-${VERSION}.zip ../
          mv rp2040-${VERSION}.zip ../


      - name: Hash & size
        run: |
          sha256sum "esp32-${VERSION}.zip"  | awk '{print $1}' > esp32.sha256
          sha256sum "rp2040-${VERSION}.zip" | awk '{print $1}' > rp2040.sha256
          stat -c%s  "esp32-${VERSION}.zip"  > esp32.size
          stat -c%s  "rp2040-${VERSION}.zip" > rp2040.size

      # 2) Separat main auschecken, dort docs/… bearbeiten
      - name: Checkout main for docs
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Append to docs/package_dadamachines_ctag_tbd_index.json
        working-directory: repo-main
        run: |
          python tools/append_platform.py \
            --index docs/package_dadamachines_ctag_tbd_index.json \
            --version "${VERSION}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/" \
            --esp32-zip "esp32-${VERSION}.zip" \
            --esp32-size "$(stat -c%s ../esp32-${VERSION}.zip)" \
            --esp32-sha "$(sha256sum ../esp32-${VERSION}.zip | awk '{print $1}')" \
            --rp2040-zip "rp2040-${VERSION}.zip" \
            --rp2040-size "$(stat -c%s ../rp2040-${VERSION}.zip)" \
            --rp2040-sha "$(sha256sum ../rp2040-${VERSION}.zip | awk '{print $1}')" \
            --size-as-string

      - name: Commit updated index to main
        working-directory: repo-main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/package_dadamachines_ctag_tbd_index.json
          git commit -m "index: add ${VERSION}" || echo "No changes"
          git push

      - name: Remove old assets from this release (keep only current zips)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          rid=$(gh api repos/${{ github.repository }}/releases/tags/v${VERSION} --jq '.id')
          gh api repos/${{ github.repository }}/releases/$rid/assets --jq '.[].id' | while read id; do
            name=$(gh api repos/${{ github.repository }}/releases/assets/$id --jq '.name')
            case "$name" in
              "esp32-${VERSION}.zip"|"rp2040-${VERSION}.zip"|"Source code (zip)"|"Source code (tar.gz)")
                echo "keep $name"
                ;;
              *)
                echo "delete $name"
                gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id
                ;;
            esac
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            esp32-${{ env.VERSION }}.zip
            rp2040-${{ env.VERSION }}.zip
          generate_release_notes: true
